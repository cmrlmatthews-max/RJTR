<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="100%" role="img" aria-label="Detention vs retention pond" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Detention vs retention pond</title><defs><marker id="a-detention-vs-retention" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-detention-vs-retention" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><text x="10" y="16" text-anchor="start" font-weight="700">DETENTION: dry between storms</text><path d="M8,52 L100,52 L135,98 L225,98 L260,52 L352,52" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="14" y1="34" x2="60" y2="48" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-detention-vs-retention)"/><text x="14" y="30" text-anchor="start">inflow</text><polygon points="116,74 244,74 225,98 135,98" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="0" stroke-linejoin="round"/><line x1="116" y1="74" x2="244" y2="74" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><text x="180" y="66" text-anchor="middle">storm level, temporary</text><line x1="226" y1="92" x2="350" y2="92" stroke="currentColor" stroke-width="3" marker-end="url(#a-detention-vs-retention)"/><text x="352" y="110" text-anchor="end">small outlet at bottom</text><text x="180" y="126" text-anchor="middle">Slows and delays the peak flow, then empties.</text><text x="10" y="156" text-anchor="start" font-weight="700">RETENTION: permanent pool</text><path d="M8,192 L100,192 L135,238 L225,238 L260,192 L352,192" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><line x1="14" y1="174" x2="60" y2="188" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-detention-vs-retention)"/><text x="14" y="170" text-anchor="start">inflow</text><polygon points="124,220 236,220 225,238 135,238" fill="#c8a24a" fill-opacity="0.4" stroke="currentColor" stroke-width="0" stroke-linejoin="round"/><line x1="116" y1="202" x2="244" y2="202" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><text x="180" y="198" text-anchor="middle">storm level, temporary</text><text x="180" y="234" text-anchor="middle" font-weight="700">permanent pool</text><line x1="262" y1="202" x2="350" y2="202" stroke="currentColor" stroke-width="3" marker-end="url(#a-detention-vs-retention)"/><text x="352" y="218" text-anchor="end">outlet above</text><text x="352" y="232" text-anchor="end">the pool</text><text x="180" y="266" text-anchor="middle">Holds water year-round; only the extra overflows.</text></svg>