<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="100%" role="img" aria-label="Floor area types, nested" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Floor area types, nested</title><defs><marker id="a-floor-area-types" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-floor-area-types" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><rect x="8" y="30" width="344" height="226" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5"/><text x="18" y="47" text-anchor="start" font-weight="700">GROSS</text><text x="18" y="62" text-anchor="start">outside face of walls; core and circulation</text><rect x="26" y="72" width="308" height="172" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/><text x="36" y="89" text-anchor="start" font-weight="700">RENTABLE</text><text x="36" y="104" text-anchor="start">gross minus stairs, elevators, MEP shafts</text><rect x="44" y="114" width="272" height="118" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="54" y="131" text-anchor="start" font-weight="700">USABLE</text><text x="54" y="146" text-anchor="start">rentable minus shared lobby/common</text><rect x="62" y="156" width="236" height="64" fill="#c8a24a" fill-opacity="0.3" stroke="#c8a24a" stroke-width="1.5"/><text x="72" y="173" text-anchor="start" font-weight="700">NET</text><text x="72" y="188" text-anchor="start">program rooms, no circulation</text><text x="180" y="278" text-anchor="middle" font-weight="700">Go RUN: Gross &gt; Rentable &gt; Usable &gt; Net</text></svg>