<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252" width="100%" role="img" aria-label="Building coverage ratio and floor area ratio" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Building coverage ratio and floor area ratio</title><defs><marker id="a-far-and-bcr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-far-and-bcr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><rect x="10" y="20" width="200" height="100" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5"/><text x="110" y="138" text-anchor="middle">site 20,000 sf</text><rect x="60" y="40" width="100" height="60" fill="#c8a24a" fill-opacity="0.35" stroke="currentColor" stroke-width="1.5"/><text x="110" y="66" text-anchor="middle">footprint</text><text x="110" y="82" text-anchor="middle">6,000 sf</text><rect x="240" y="26" width="100" height="24" fill="#c8a24a" fill-opacity="0.3" stroke="currentColor" stroke-width="1.5"/><text x="290" y="42" text-anchor="middle">floor 3  6,000</text><rect x="240" y="60" width="100" height="24" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="290" y="76" text-anchor="middle">floor 2  6,000</text><rect x="240" y="94" width="100" height="24" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5"/><text x="290" y="110" text-anchor="middle">floor 1  6,000</text><text x="290" y="134" text-anchor="middle" font-weight="700">= 18,000 sf total</text><line x1="14" y1="158" x2="346" y2="158" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4"/><text x="14" y="182" text-anchor="start" font-weight="700">BCR = footprint ÷ site × 100</text><text x="14" y="198" text-anchor="start">= 6,000 ÷ 20,000 × 100 = 30%</text><text x="14" y="224" text-anchor="start" font-weight="700">FAR = total floor area ÷ site</text><text x="14" y="240" text-anchor="start">= 18,000 ÷ 20,000 = 0.9</text></svg>