d</text><text x="45" y="164" text-anchor="middle">valley</text><text x="130" y="108" text-anchor="middle">Cold</text><text x="130" y="122" text-anchor="middle">lower-mid slope</text><text x="190" y="62" text-anchor="middle">Temperate</text><text x="190" y="76" text-anchor="middle">upper-mid slope</text><text x="292" y="14" text-anchor="middle">Hot-humid</text><text x="292" y="28" text-anchor="middle">crest, breezy</text><text x="180" y="252" text-anchor="middle">Cold air sinks to the valley; the crest is windiest</text></svg>