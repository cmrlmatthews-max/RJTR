<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" width="100%" role="img" aria-label="Cut and fill: bank, loose, compacted" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Cut and fill: bank, loose, compacted</title><defs><marker id="a-cut-fill-soil-volumes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-cut-fill-soil-volumes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><polygon points="10,90 60,60 110,70 160,100 210,120 260,110 350,100 350,150 10,150" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-width="0" stroke-linejoin="round"/><polygon points="10,95 10,90 60,60 110,70 151.7,95" fill="#c8a24a" fill-opacity="0.35" stroke="currentColor" stroke-width="0" stroke-linejoin="round"/><polygon points="151.7,95 160,100 210,120 260,110 350,100 350,95" fill="currentColor" fill-opacity="0.22" stroke="currentColor" stroke-width="0" stroke-linejoin="round"/><polyline points="10,90 60,60 110,70 160,100 210,120 260,110 350,100" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 3" stroke-linejoin="round"/><line x1="10" y1="95" x2="350" y2="95" stroke="currentColor" stroke-width="2"/><text x="80" y="90" text-anchor="middle" font-weight="700">CUT</text><text x="240" y="113" text-anchor="middle" font-weight="700">FILL</text><text x="180" y="168" text-anchor="middle">dashed = existing grade   solid = proposed grade</text><line x1="14" y1="184" x2="346" y2="184" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4"/><text x="180" y="204" text-anchor="middle" font-weight="700">The same soil takes three different volumes</text><rect x="34" y="216" width="72" height="60" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="70" y="292" text-anchor="middle" font-weight="700">Bank (in place)</text><text x="70" y="307" text-anchor="middle">1.00</text><rect x="144" y="198" width="72" height="78" fill="#c8a24a" fill-opacity="0.35" stroke="#c8a24a" stroke-width="1.5"/><text x="180" y="292" text-anchor="middle" font-weight="700">Loose (hauled)</text><text x="180" y="307" text-anchor="middle">bank × (1 + swell)</text><rect x="254" y="224" width="72" height="52" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="290" y="292" text-anchor="middle" font-weight="700">Compacted (fill)</text><text x="290" y="307" text-anchor="middle">bank × (1 − shrink)</text><line x1="30" y1="216" x2="330" y2="216" stroke="currentColor" stroke-width="1" stroke-dasharray="3 3"/></svg>