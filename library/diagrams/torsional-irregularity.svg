<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" width="100%" role="img" aria-label="Torsional irregularity: CM vs CR" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Torsional irregularity: CM vs CR</title><defs><marker id="a-torsional-irregularity" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-torsional-irregularity" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><rect x="35" y="60" width="110" height="90" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5"/><line x1="90" y1="24" x2="90" y2="54" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-torsional-irregularity)"/><text x="90" y="16" text-anchor="middle">quake force</text><line x1="145" y1="60" x2="145" y2="150" stroke="#c8a24a" stroke-width="6"/><line x1="35" y1="93" x2="35" y2="117" stroke="#c8a24a" stroke-width="6"/><circle cx="90" cy="105" r="5" fill="currentColor" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="80" y="124" text-anchor="end">CM</text><line x1="120" y1="100" x2="130" y2="110" stroke="currentColor" stroke-width="2"/><line x1="120" y1="110" x2="130" y2="100" stroke="currentColor" stroke-width="2"/><text x="135" y="124" text-anchor="start">CR</text><path d="M 60 172 Q 90 190 120 172" fill="none" stroke="#c8a24a" stroke-width="2" stroke-linejoin="round" marker-end="url(#ag-torsional-irregularity)"/><text x="90" y="210" text-anchor="middle" font-weight="700">CR offset from CM</text><text x="90" y="226" text-anchor="middle">the building twists</text><rect x="215" y="60" width="110" height="90" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.5"/><line x1="270" y1="24" x2="270" y2="54" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-torsional-irregularity)"/><text x="270" y="16" text-anchor="middle">quake force</text><line x1="325" y1="78" x2="325" y2="132" stroke="#c8a24a" stroke-width="6"/><line x1="215" y1="78" x2="215" y2="132" stroke="#c8a24a" stroke-width="6"/><circle cx="270" cy="105" r="5" fill="currentColor" fill-opacity="0.9" stroke="currentColor" stroke-width="1.5"/><text x="260" y="124" text-anchor="end">CM</text><line x1="265" y1="100" x2="275" y2="110" stroke="currentColor" stroke-width="2"/><line x1="265" y1="110" x2="275" y2="100" stroke="currentColor" stroke-width="2"/><text x="280" y="124" text-anchor="start">CR</text><text x="270" y="210" text-anchor="middle" font-weight="700">CR close to CM</text><text x="270" y="226" text-anchor="middle">little twisting</text><text x="180" y="252" text-anchor="middle">CM = center of mass   CR = center of rigidity</text></svg>