<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" width="100%" role="img" aria-label="Reading contours: peak, ridge, valley, saddle" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Reading contours: peak, ridge, valley, saddle</title><defs><marker id="a-contour-landforms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-contour-landforms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><text x="90" y="16" text-anchor="middle" font-weight="700">Peak</text><ellipse cx="90" cy="70" rx="55" ry="38" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5"/><ellipse cx="90" cy="70" rx="36" ry="25" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5"/><ellipse cx="90" cy="70" rx="17" ry="12" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5"/><text x="90" y="74" text-anchor="middle">high</text><text x="270" y="16" text-anchor="middle" font-weight="700">Ridge</text><path d="M 210 28 L 210 92 Q 210 128 270 128 Q 330 128 330 92 L 330 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M 228 28 L 228 82 Q 228 108 270 108 Q 312 108 312 82 L 312 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M 246 28 L 246 73 Q 246 88 270 88 Q 294 88 294 73 L 294 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><line x1="270" y1="60" x2="270" y2="128" stroke="#c8a24a" stroke-width="2" stroke-dasharray="4 3"/><text x="90" y="176" text-anchor="middle" font-weight="700">Valley</text><path d="M 30 288 L 30 232 Q 30 196 90 196 Q 150 196 150 232 L 150 288" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M 48 288 L 48 239 Q 48 214 90 214 Q 132 214 132 239 L 132 288" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M 66 288 L 66 246 Q 66 232 90 232 Q 114 232 114 246 L 114 288" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="196" x2="90" y2="270" stroke="#c8a24a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ag-contour-landforms)"/><text x="270" y="176" text-anchor="middle" font-weight="700">Saddle</text><path d="M 190 240 C 190 200 240 204 270 228 C 300 204 350 200 350 240 C 350 280 300 276 270 252 C 240 276 190 280 190 240 Z" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="222" cy="240" rx="22" ry="16" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5"/><ellipse cx="318" cy="240" rx="22" ry="16" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-width="1.5"/><circle cx="270" cy="240" r="4" fill="#c8a24a" fill-opacity="0.9" stroke="#c8a24a" stroke-width="1.5"/><text x="270" y="296" text-anchor="middle">pass between two highs</text><text x="180" y="318" text-anchor="middle">Closed rings = peak. Water runs across contours at 90°.</text></svg>