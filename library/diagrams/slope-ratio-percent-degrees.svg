<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 282" width="100%" role="img" aria-label="Slope as ratio, percent, degrees" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Slope as ratio, percent, degrees</title><defs><marker id="a-slope-ratio-percent-degrees" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-slope-ratio-percent-degrees" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><polygon points="30,160 250,160 250,105" fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><rect x="240" y="150" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1"/><path d="M 74 160 A 44 44 0 0 0 73 148.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><text x="84" y="156" text-anchor="start">14°</text><text x="140" y="180" text-anchor="middle" font-weight="700">run = 4</text><text x="258" y="136" text-anchor="start" font-weight="700">rise = 1</text><line x1="30" y1="160" x2="250" y2="105" stroke="#c8a24a" stroke-width="3"/><text x="14" y="212" text-anchor="start">Percent = rise ÷ run × 100  →  1 ÷ 4 = 25%</text><text x="14" y="230" text-anchor="start">Ratio = run : rise  →  4:1  (4 across for 1 up)</text><text x="14" y="248" text-anchor="start">Angle = arctan(rise ÷ run)  →  14°</text><text x="14" y="270" text-anchor="start" font-weight="700">Percent and degrees differ: 100% slope = 45°</text></svg>