<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 308" width="100%" role="img" aria-label="Solar panel tilt by season" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Solar panel tilt by season</title><defs><marker id="a-pv-tilt-vs-season" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-pv-tilt-vs-season" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><line x1="5" y1="210" x2="115" y2="210" stroke="currentColor" stroke-width="2"/><line x1="60" y1="140" x2="60" y2="210" stroke="currentColor" stroke-width="1.2"/><line x1="30.6" y1="134.3" x2="89.4" y2="145.7" stroke="#c8a24a" stroke-width="6"/><line x1="74.1" y1="67.4" x2="62.3" y2="128.2" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-pv-tilt-vs-season)"/><text x="60" y="232" text-anchor="middle" font-weight="700">Summer</text><text x="60" y="248" text-anchor="middle">flatter panel</text><text x="60" y="264" text-anchor="middle">≈ 11° tilt</text><text x="60" y="30" text-anchor="middle">sun 79° high</text><line x1="125" y1="210" x2="235" y2="210" stroke="currentColor" stroke-width="2"/><line x1="180" y1="140" x2="180" y2="210" stroke="currentColor" stroke-width="1.2"/><line x1="155.1" y1="123.2" x2="204.9" y2="156.8" stroke="#c8a24a" stroke-width="6"/><line x1="221.4" y1="78.7" x2="186.7" y2="130.1" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-pv-tilt-vs-season)"/><text x="180" y="232" text-anchor="middle" font-weight="700">Equinox</text><text x="180" y="248" text-anchor="middle">tilt ≈ latitude</text><text x="180" y="264" text-anchor="middle">≈ 34° tilt</text><text x="180" y="30" text-anchor="middle">sun 56° high</text><line x1="245" y1="210" x2="355" y2="210" stroke="currentColor" stroke-width="2"/><line x1="300" y1="140" x2="300" y2="210" stroke="currentColor" stroke-width="1.2"/><line x1="283.7" y1="114.8" x2="316.3" y2="165.2" stroke="#c8a24a" stroke-width="6"/><line x1="362.1" y1="99.7" x2="310.1" y2="133.5" stroke="currentColor" stroke-width="1.5" marker-end="url(#a-pv-tilt-vs-season)"/><text x="300" y="232" text-anchor="middle" font-weight="700">Winter</text><text x="300" y="248" text-anchor="middle">steeper panel</text><text x="300" y="264" text-anchor="middle">≈ 57° tilt</text><text x="300" y="30" text-anchor="middle">sun 33° high</text><text x="180" y="296" text-anchor="middle">South at right. Example latitude 34°N.</text></svg>