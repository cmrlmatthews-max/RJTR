<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 238" width="100%" role="img" aria-label="Compact vs spread building form" font-family="system-ui, sans-serif" font-size="12" fill="currentColor"><title>Compact vs spread building form</title><defs><marker id="a-compact-vs-spread-form" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker><marker id="ag-compact-vs-spread-form" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c8a24a"/></marker></defs><text x="180" y="20" text-anchor="middle" font-weight="700">Same floor area</text><rect x="25" y="40" width="90" height="90" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><rect x="150" y="62" width="180" height="45" fill="currentColor" fill-opacity="0.1" stroke="currentColor" stroke-width="1.5"/><text x="70" y="152" text-anchor="middle" font-weight="700">Compact</text><text x="70" y="168" text-anchor="middle">wall length 360</text><text x="240" y="152" text-anchor="middle" font-weight="700">Spread</text><text x="240" y="168" text-anchor="middle">wall length 450</text><line x1="14" y1="188" x2="346" y2="188" stroke="currentColor" stroke-width="1" stroke-dasharray="2 4"/><text x="180" y="208" text-anchor="middle">Cold climate: compact form loses less heat.</text><text x="180" y="226" text-anchor="middle">Hot-humid climate: spread form catches more breeze.</text></svg>